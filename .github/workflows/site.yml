name: Build and validate site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Check required files
        run: |
          test -f _config.yaml
          test -f robots.txt
          test -f sitemap.xml
          test -f feed.xml
          test -f index.html
          test -f 404.html
          test -f engineering/index.html
          test -f docs/index.html
          test -d _includes
          test -d _layouts

      - name: Check generated sitemap and feed
        run: |
          test -f _site/sitemap.xml
          test -f _site/feed.xml

      - name: Check absolute URL configuration
        run: grep -q '^url: https://www.genefold.ai' _config.yaml

      - name: Check for accidental localhost URLs
        run: |
          ! grep -R "localhost\|127.0.0.1" _site

      - name: Validate metadata, links, and sitemap
        run: python3 scripts/check_meta.py

      - name: Check for broken internal references (htmlproofer)
        run: |
          gem install htmlproofer -v 5 --no-document
          htmlproofer ./_site \
            --disable-external \
            --check-html \
            --allow-hash-href